<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM 验收对比工具</title>
<style>
:root{
  --bg:#F0EEE6; --surface:#FFFFFF; --surface-2:#FAF9F4; --surface-3:#F3F1E8;
  --ink:#1F1E1D; --ink-2:#3F3D39; --muted:#76746C; --faint:#9B9A90;
  --border:#E5E2D8; --border-strong:#D6D3C6;
  --accent:#C96442; --accent-press:#B4553A; --accent-soft:#F3E2DA;
  --ok:#3F7A55; --ok-soft:#E3EFE5; --fail:#B3402F; --fail-soft:#F6E2DE;
  --warn:#9A7B2E; --warn-soft:#F4ECD7; --skip:#8A8A8A; --skip-soft:#EDEDEA;
  --radii:8px; --side-w:180px;
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--bg);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-size:13.5px;line-height:1.55}

/* ===== 布局切换：三种 ===== */
.app{max-width:1100px;margin:0 auto;padding:18px 24px}
.header{margin-bottom:16px}
.header h1{font-size:18px;font-weight:600;margin-bottom:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600;border:1px solid transparent;border-bottom:none}
.tab:hover{background:var(--surface-2);border-radius:8px 8px 0 0}
.tab.active{background:var(--accent-soft);color:var(--accent-press);border-radius:8px 8px 0 0}
.main{min-width:0}
.page-title{font-size:17px;font-weight:600;margin-bottom:4px}
.page-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px}

/* 分组卡片 */
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radii);margin-bottom:14px}
.group-head{padding:11px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.group-body{padding:13px 14px}
.group-body > .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-start}
.group-body > .row:last-child{margin-bottom:0}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label{font-size:11.5px;color:var(--muted);font-weight:500}
.field.full{flex:1}
input[type=text],input[type=number],input[type=password],select,textarea{
  border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;font-size:13px;background:var(--surface);color:var(--ink);width:100%;font-family:inherit}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:none;border-right:1px solid var(--border-strong);padding:7px 12px;font-size:12px;cursor:pointer;color:var(--ink-2);font-family:inherit}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--accent);color:#fff}

.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.toggle input{display:none}
.toggle .track{width:34px;height:18px;background:#D1D5DB;border-radius:9px;position:relative;transition:.2s;flex-shrink:0}
.toggle .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked + .track{background:var(--accent)}
.toggle input:checked + .track::after{transform:translateX(16px)}

.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 18px;font-weight:500;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--accent-press)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12px}

/* ===== 基线分组表格 ===== */
.bl-card{font-size:12.5px}
.bl-title{font-weight:600;font-size:13px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.bl-title .vendor{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:6px}
.bl-grp{margin-bottom:12px}
.bl-grp:last-child{margin-bottom:0}
.bl-grp-h{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.bl-tbl{width:100%;border-collapse:collapse}
.bl-tbl tr{border-bottom:1px solid var(--surface-3)}
.bl-tbl tr:last-child{border-bottom:none}
.bl-tbl td{padding:5px 0;vertical-align:middle}
.bl-tbl td.k{color:var(--muted);width:90px;font-size:11.5px;font-weight:500}
.bl-tbl td.v{color:var(--ink);font-weight:500}
.bl-tbl td.v .np{color:var(--warn)}
.bl-tbl td.v .no{color:var(--fail)}
.bl-tbl td.v .yes{color:var(--ok)}
.bl-feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.bl-feat .fi{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:4px 7px;display:flex;flex-direction:column;gap:1px}
.bl-feat .fk{font-size:10.5px;color:var(--muted);font-weight:500}
.bl-feat .fv{font-size:11.5px;font-weight:600}
.bl-srcs{display:flex;flex-direction:column;gap:3px}
.bl-srcs a{font-size:11px;color:var(--accent);text-decoration:none;word-break:break-all}
.bl-srcs a:hover{text-decoration:underline}
.bl-bestfor{font-size:11.5px;color:var(--ink-2);line-height:1.5}

.channel{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.ch-grid{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px}
.ch-grid .ch-base,.ch-grid .ch-key,.ch-grid .ch-hdr{grid-column:span 1}
.ch-grid .field > label{font-size:11px}
.ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch-actions{display:flex;gap:4px}
.empty{padding:18px;text-align:center;color:var(--faint);font-size:12px}

.view{display:none}
.view.show{display:block}

.runcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radii);margin-bottom:14px;overflow:hidden}
.rc-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.rc-head .ttl{font-weight:600}
.rc-head .sub{font-size:11px;color:var(--muted)}
.rc-dots{display:inline-flex;gap:2px;margin-left:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-PASS{background:var(--ok)} .dot-FAIL{background:var(--fail)} .dot-INCONCLUSIVE{background:var(--warn)} .dot-SKIP{background:var(--skip);border:1px dashed #fff}
.rc-group{border-top:1px solid var(--border)}
.rc-grp-head{padding:8px 14px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);cursor:pointer}
.rc-grp-body{padding:4px 14px}
.rc-case{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.rc-case:last-child{border-bottom:none}
.rc-case .nm{flex:1;min-width:0}
.rc-case .nm small{color:var(--faint);font-size:10.5px}
.badge{font-size:10.5px;padding:2px 6px;border-radius:4px;font-weight:500;white-space:nowrap}
.b-pass{background:var(--ok-soft);color:var(--ok)} .b-fail{background:var(--fail-soft);color:var(--fail)}
.b-inc{background:var(--warn-soft);color:var(--warn)} .b-skip{background:var(--skip-soft);color:var(--skip)}
.b-draft{background:var(--accent-soft);color:var(--accent)}

table.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.cmp th,table.cmp td{border:1px solid var(--border);padding:6px 8px;text-align:left}
table.cmp th{background:var(--surface-2);font-weight:600}
table.cmp td.rc,table.cmp th.rc{text-align:center}
.cmp-row:hover{background:var(--surface-2)}
.cmp-sub{background:var(--surface-2);font-size:11px;color:var(--muted)}
/* 进度条与状态网格 */
.rc-head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rc-progress{display:flex;align-items:center;gap:8px}
.rc-bar{width:140px;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.rc-bar-fill{height:100%;background:var(--accent);transition:width .3s}
.rc-pct{font-size:11px;color:var(--muted);white-space:nowrap}
.rc-counts{display:inline-flex;gap:4px}
.rc-channel{padding:10px 14px;border-top:1px solid var(--border)}
.rc-ch-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rc-ch-meta{font-size:11px;color:var(--muted)}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,14px);gap:3px}
.rc-cell{width:14px;height:14px;border-radius:3px;display:inline-block;cursor:pointer}
.cell-pass{background:var(--ok)} .cell-fail{background:var(--fail)}
.cell-inconclusive{background:var(--warn)} .cell-skip{background:var(--skip);border:1px dashed #fff}
.cell-pending{background:var(--surface-3);border:1px solid var(--border-strong)}
.cell-running{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.badge.b-pending{background:var(--surface-3);color:var(--muted)}
.badge.b-running{background:var(--accent-soft);color:var(--accent-press)}
/* 明细展开 */
.rc-detail{padding:10px 14px;border-top:1px solid var(--border);font-size:11.5px;background:var(--surface-2)}
.rc-detail .dl{display:grid;grid-template-columns:70px 1fr;gap:4px 8px}
.rc-detail .dl dt{color:var(--muted);font-weight:500}
.rc-detail .dl dd{color:var(--ink);word-break:break-all}
.rc-detail .outbox{margin-top:6px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;font-family:Consolas,monospace;font-size:10.5px;white-space:pre-wrap;max-height:120px;overflow:auto}


.chat-log{border:1px solid var(--border);border-radius:6px;padding:12px;height:340px;overflow:auto;margin-bottom:10px;background:var(--surface)}
.chat-msg{margin-bottom:8px;font-size:12px}
.chat-msg .who{font-size:10.5px;color:var(--faint);margin-bottom:2px}
.chat-msg.user .who{color:var(--accent)}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1}

.note{font-size:11.5px;color:var(--muted);padding:7px 11px;background:var(--surface-2);border-radius:6px;margin-top:8px}
.note-top{font-size:11px;color:var(--muted);padding:4px 0}
.probe-out{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px;margin-top:8px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px;max-height:200px;overflow:auto}
.gen-out{margin-top:10px}

/* B 布局：人设文本区 */
.preset-text{font-size:12.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>LLM 验收对比工具</h1>
    <div class="tabs">
      <div class="tab active" data-v="launch">发起测试</div>
      <div class="tab" data-v="running">进行中</div>
      <div class="tab" data-v="done">已完成</div>
      <div class="tab" data-v="chat">对话分析</div>
    </div>
  </div>
<div class="main">

  <!-- ===== 发起测试 ===== -->
  <section class="view show" id="v-launch">
    <div class="page-title">发起测试</div>
    <div class="page-sub">配置模型与通道，发同一份请求，对比各路返回是否与官方对齐。</div>

    <!-- col-mid 配置面板 -->
    
    <div class="group">
      <div class="group-head">模型设置</div>
      <div class="group-body">
        <div class="row">
          <div class="field" style="min-width:200px"><label>模型</label><select id="modelSelect"></select></div>
          <div class="field"><label>协议类型</label><div class="seg" id="protoSeg"></div></div>
          <div class="field"><label>Profile 档位</label><div class="seg" id="profileSeg"></div></div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-head">生成多样性</div>
      <div class="group-body">
        <div class="row"><div class="field full"><label>多样性模式</label><div class="seg" id="divSeg"></div></div></div>
        <div class="row" id="customParams" style="display:none">
          <div class="field" style="min-width:100px"><label>Temperature</label><input id="gTemp" value="1" type="number" step="0.1"></div>
          <div class="field" style="min-width:100px"><label>Top_p</label><input id="gTopP" value="0.95" type="number" step="0.01"></div>
          <div class="field" style="min-width:110px"><label>Max_Tokens</label><input id="gMax" value="1024" type="number"></div>
        </div>
        <div class="row">
          <div class="field" style="min-width:90px"><label>携带上下文</label><input type="number" value="3" style="width:70px"></div>
          <div class="field" style="min-width:100px"><label>最大回复长度</label><input type="number" value="2000" style="width:90px"></div>
          <div class="field full"><label>统一 Prompt</label><input id="gPrompt" type="text" value="请精确回复 SPEC_TEXT_OK"></div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-head">深度思考</div>
      <div class="group-body">
        <div class="row">
          <div class="field"><label>思考开关</label><div class="seg" id="thinkSeg"></div></div>
          <div class="field"><label>思考程度</label><div class="seg" id="effortSeg"></div></div>
          <div class="field"><label>重复语句惩罚</label><input type="number" value="0" style="width:80px"></div>
        </div>
        <div class="note">开关与程度分开配置。基线不支持关闭思考的模型，关闭项标 SKIP。</div>
      </div>
    </div>

    <div class="group">
      <div class="group-head">对比通道 <button class="btn ghost sm" id="addCh">增加通道</button></div>
      <div class="group-body"><div id="channels"></div></div>
    </div>

    <div class="group">
      <div class="group-body">
        <div class="row" style="align-items:center">
          <button class="btn" id="launchBtn">启动</button>
          <label class="toggle"><input type="checkbox" id="realMode" checked><span class="track"></span><span>真发请求</span></label>
          <span id="launchNote" class="note-top"></span>
        </div>
        <div class="note">真发模式需启动本地 serve.py。未启动时使用模拟数据，官网未公布项判 INC，不适用项判 SKIP。</div>
      </div>
    </div>

    <div class="group">
      <div class="group-head">探针测试</div>
      <div class="group-body">
        <div class="row">
          <div class="field" style="min-width:180px"><label>Endpoint</label><input id="probeUrl" type="text" placeholder="https://..."></div>
          <div class="field" style="min-width:160px"><label>API Key</label><input id="probeKey" type="password" placeholder="sk-..."></div>
          <div class="field" style="min-width:120px"><label>模型 ID</label><input id="probeModel" type="text" placeholder="glm-5.2"></div>
          <div class="field" style="min-width:70px;justify-content:flex-end"><label>&nbsp;</label><button class="btn" id="probeBtn">发送</button></div>
        </div>
        <div class="row"><span id="probeStatus" class="note-top"></span><label class="toggle" style="font-size:11px"><input type="checkbox" id="probeKeyToggle"><span class="track"></span><span>显示 Key</span></label></div>
        <div id="probeOut" class="probe-out" style="display:none"></div>
      </div>
    </div>

    <div class="group">
      <div class="group-head">用例生成</div>
      <div class="group-body">
        <div class="row">
          <div class="field" style="min-width:120px"><label>目标模型</label><select id="genModel"></select></div>
          <div class="field" style="min-width:120px"><label>维度</label><select id="genDim"><option>能力存在性</option><option>参数边界</option><option>默认值</option><option>参数生效</option></select></div>
        </div>
        <div class="row"><div class="field full"><label>客户测试标准</label><textarea id="genStd" placeholder="例：temperature=0 时对同一问题两次回答完全一致；temperature=5 时应报错拒绝。"></textarea></div></div>
        <div class="row"><button class="btn" id="genBtn">生成</button> <button class="btn ghost sm" id="clearGen">清空</button></div>
        <div id="genOut" class="gen-out"></div>
      </div>
    </div>

    <!-- col-right 基线（B 布局放右栏；A/C 布局在配置下方） -->
    
    <div class="group">
      <div class="group-head">官方基线</div>
      <div class="group-body"><div id="baselineBox" class="bl-card"></div></div>
    </div>

  </section>

  <section class="view" id="v-running">
    <div class="page-title">进行中</div>
    <div class="page-sub">每 5 秒自动刷新。</div>
    <div id="runningGrid"></div>
  </section>

  <section class="view" id="v-done">
    <div class="page-title">已完成</div>
    <div class="page-sub">每路一张验证卡，下方为多路并排对比表。</div>
    <div id="doneGrid"></div>
    <div class="page-title" style="margin-top:18px">多路并排对比表</div>
    <div id="compareView"></div>
  </section>

  <section class="view" id="v-chat">
    <div class="page-title">对话分析</div>
    <div class="page-sub">基于已完成结果，用本地向量检索回答问题。</div>
    <div class="row" style="margin-bottom:12px">
      <div class="field" style="min-width:260px"><label>分析员通道</label><select id="analystCh"></select></div>
      <div class="field" style="min-width:110px"><label>检索历史条数</label><select id="chatTopK"><option value="5">5</option><option value="8" selected>8</option><option value="15">15</option></select></div>
      <div class="field" style="min-width:90px;justify-content:flex-end"><label>&nbsp;</label><button class="btn ghost sm" id="chatClear">清空</button></div>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chat-input-row"><input id="chatInput" placeholder="如：Kimi 和 DeepSeek 在哪几项上不一致？"><button class="btn" id="chatSend">提问</button></div>
    <div class="note">向量库：浏览器内 TF-IDF 加余弦相似，无外部依赖。</div>
  </section>

  </div><!-- /main -->
</div><!-- /app -->

<select id="protoSelect" style="display:none"></select>
<select id="profileSelect" style="display:none"></select>
<script src="_data.js"></script>
<script>
// PLAN 兼容：若是 {0:..} 对象则转数组
const PLAN_ARR = (function(){ try{ return Object.keys(PLAN).some(k=>/^\d+$/.test(k)) ? Object.values(PLAN) : (Array.isArray(PLAN)?PLAN:[]); }catch(e){ return []; } })();

// ====== 模型树扁平化(厂商→版本) ======
const MODELS = [];
for (const vid of Object.keys(CATALOG)) {
  const v = CATALOG[vid];
  for (const ver of (v.versions||[])) {
    MODELS.push({ vendor:v.name, vendorId:vid, ...ver,
      api_base: v.api_base_url,
      platform_params: v.platform_params });
  }
}
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ====== 基线提取助手(适配 catalog 归一化字段) ======
function bl(m){
  const bs=m.baseline||{};
  // 收集官网来源(去重,仅 http 链接)
  let srcs=[];
  const pushSrc=(o)=>{ if(o&&o.source&&/^https?:/.test(o.source)&&!srcs.includes(o.source)) srcs.push(o.source); };
  if(bs.context_window) pushSrc(bs.context_window);
  if(bs.max_output_tokens) pushSrc(bs.max_output_tokens);
  if(bs.temperature_range) pushSrc(bs.temperature_range);
  if(bs.top_p_range) pushSrc(bs.top_p_range);
  if(bs.concurrency_limit) pushSrc(bs.concurrency_limit);
  if(bs.pricing) pushSrc(bs.pricing);
  if(bs.features){ Object.values(bs.features).forEach(pushSrc); }
  return {
    ctx: m.context, maxOut: m.maxOutput,
    temp: m.temp, topp: m.topp,
    feat: m.features || {},
    pricing: m.pricing, rl: m.rate_limits,
    protos: m.protocols||[],
    notpub: m.maxOutput === "NOT_PUBLISHED",
    bestFor: bs.best_for||'',
    bpr: bs.pricing||{},
    benchmark: bs.benchmark_scores||null,
    sources: srcs
  };
}

// ====== 初始化下拉 ======
function initSelects(){
  const ms=$("#modelSelect"), gm=$("#genModel");
  MODELS.forEach((m,i)=>{
    const o=document.createElement("option"); o.value=i;
    o.textContent=`${m.vendor} · ${m.name}`; ms.appendChild(o); gm.appendChild(o.cloneNode(true));
  });
  ms.addEventListener("change",()=>{ renderBaseline(+ms.value); syncProto(); });
  $("#protoSelect").addEventListener("change",()=>{ /* 可留 */ });
  ms.value=0; gm.value=0; renderBaseline(0); syncProto();
}
function syncProto(){

// ====== 模拟判定:单模型单用例→四态 ======
function judgeOne(m, p, profile){
  const b=bl(m); const cases=PLAN_ARR;
  // 该模型是否支持该用例? SKIP 规则
  if(p==='cap_multimodal_image_input' && !(b.feat&&b.feat.vision===true)) return 'SKIP';
  if(p==='cap_thinking_disabled' && b.feat&&b.feat.thinking_mode===true && /强制|强制思考/.test((b.feat.thinking_mode&&b.feat.thinking_mode.note)||'')) return 'SKIP';
  if((p==='spec_context_window'||p==='spec_max_output_parameter') && b.notpub && p==='spec_max_output_parameter') return 'INCONCLUSIVE';
  // 未公布字段相关
  if(p==='spec_max_output_parameter' && b.notpub) return 'INCONCLUSIVE';
  if((p==='spec_parameter_boundaries') && (!b.temp)) return 'INCONCLUSIVE';
  // Kimi K2 不暴露采样参数
  if(/kimi-k2/.test(m.id) && (p==='spec_parameter_boundaries')) return 'SKIP';
  // 模拟:大多数PASS,少量FAIL/INC
  const seed=(m.id+p).length;
  if(seed%7===0) return 'FAIL';
  if(seed%11===0) return 'INCONCLUSIVE';
  if(seed%13===0 && profile==='smoke') return 'SKIP';
  return 'PASS';
}
function simulateMulti(chans, params, profile){
  return PLAN_ARR.map(c=>({ case:c, perChannel: chans.map(ch=>({ch, status:judgeOne(ch.model,c.id,profile)})) }));
}

// ====== 进行中/已完成渲染 ======
function rcBadge(s){return {PASS:'<span class="badge b-pass">PASS</span>',FAIL:'<span class="badge b-fail">FAIL</span>',INCONCLUSIVE:'<span class="badge b-inc">INC</span>',SKIP:'<span class="badge b-skip">SKIP</span>',PENDING:'<span class="badge b-pending">等待</span>',RUNNING:'<span class="badge b-running">跑测中</span>'}[s];}
function rdots(arr){return arr.map(st=>`<span class="dot dot-${st}" title="${st}"></span>`).join('');}
function overall(counts){
  if(counts.FAIL>0) return {t:'未对齐',c:'b-fail'};
  if(counts.INCONCLUSIVE>0) return {t:'部分对齐',c:'b-inc'};
  return {t:'对齐',c:'b-pass'};
}
function runCard(run, multi){
  const c=el('div','runcard');
  const head=el('div','rc-head');
  const ttl=multi?`多路验收 · ${run.channels.length}路 · profile=${run.profile}`:`${run.metadata?.model||''} · ${run.metadata?.api_format||''}`;
  const t=new Date(run.started_at).toLocaleString();
  // 进度计算
  let doneN=0, total=0;
  run.results.forEach(r=>{ r.perChannel.forEach(pc=>{ total++; if(pc.status!=='PENDING'&&pc.status!=='RUNNING') doneN++; }); });
  const pct=total?Math.round(doneN/total*100):0;
  const counts=multi?multiCounts(run.results):{};
  const ov=overall(counts);
  let headRight='';
  if(run.running){
    headRight=`<div class="rc-progress"><div class="rc-bar"><div class="rc-bar-fill" style="width:${pct}%"></div></div><span class="rc-pct">${doneN}/${total} (${pct}%)</span></div>`;
  }else{
    headRight=`<span class="badge ${ov.c}">${ov.t}</span>`+`<span class="rc-counts">`+
      ['PASS','FAIL','INCONCLUSIVE','SKIP'].map(k=>counts[k]?`<span class="badge b-${k.toLowerCase()}">${k.replace('INCONCLUSIVE','INC')} ${counts[k]}</span>`:'').join('')+`</span>`;
  }
  head.innerHTML=`<div><div class="ttl">${ttl}</div><div class="meta">${run.run_id} · ${t}${run.running?' · 跑测中':''}</div></div><div class="rc-head-right">${headRight}</div>`;
  c.appendChild(head);
  if(!multi) return c;
  // 每路区块
  run.channels.forEach((ch,ci)=>{
    const sub=el('div','rc-channel');
    const per=run.results.map(r=>r.perChannel[ci]);
    const ccnt=cnt(per.filter(s=>['PASS','FAIL','INCONCLUSIVE','SKIP'].includes(s.status)).map(s=>s.status));
    const cov=overall(ccnt);
    let chHead=`<div class="rc-ch-head"><b>${esc(ch.model.name)}</b> <span class="rc-ch-meta">${esc(ch.proto)} · ${esc(ch.base||'—')}</span> <span class="badge ${cov.c}">${cov.t}</span></div>`;
    // 逐用例状态网格
    chHead+=`<div class="rc-grid">`+per.map((pc,pi)=>{
      const st=pc.status;
      const tip=run.results[pi].case.name+(pc.note?' · '+esc(pc.note):'')+(pc.elapsed?' · '+pc.elapsed+'ms':'');
      return `<span class="rc-cell cell-${st.toLowerCase()}" title="${esc(tip)}" data-ci="${ci}" data-pi="${pi}"></span>`;
    }).join('')+`</div>`;
    // 明细展开容器(点击 cell 填充)
    chHead+=`<div class="rc-detail" data-detail-for="${ci}" style="display:none"></div>`;
    sub.innerHTML=chHead;
    // 绑定 cell 点击 → 填充明细
    sub.querySelectorAll('.rc-cell').forEach(cell=>{
      cell.onclick=()=>{
        const pi=+cell.dataset.pi;
        const pc=run.results[pi].perChannel[ci];
        const cs=run.results[pi].case;
        const box=sub.querySelector('[data-detail-for="'+ci+'"]');
        const visible=box.style.display!=='none' && box.dataset.cur===String(pi);
        if(visible){ box.style.display='none'; box.dataset.cur=''; return; }
        box.dataset.cur=String(pi);
        box.style.display='block';
        box.innerHTML=renderCaseDetail(cs, pc, ch);
      };
    });
    c.appendChild(sub);
  });
  return c;
}
// 单用例明细:用例信息 + 期望 + 实测输出 + 耗时 + 备注 + refs
function renderCaseDetail(cs, pc, ch){
  let h='<dl class="dl">';

  h+='</dl>';

    if(pc.out.isStream){ h+='<div style="color:var(--muted);margin-bottom:2px">流式响应(SSE)</div>'; h+='<div>'+esc(String(pc.out.content).slice(0,500))+'</div>'; }
    else if(pc.out.content){ h+='<div style="color:var(--muted);margin-bottom:2px">content</div>'; h+='<div>'+esc(pc.out.content)+'</div>'; }
    if(pc.out.reasoning){ h+='<div style="color:var(--muted);margin:4px 0 2px">reasoning(前300字)</div>'; h+='<div>'+esc(String(pc.out.reasoning).slice(0,300))+'</div>'; }
    if(!pc.out.content&&!pc.out.reasoning&&!(pc.out.toolCalls&&pc.out.toolCalls.length)) h+='<div style="color:var(--faint)">HTTP '+pc.out.http+' · 无文本输出</div>';

  }
  return h;
}
function cnt(arr){return arr.reduce((a,s)=>{a[s]=(a[s]||0)+1;return a;},{});}
function multiCounts(results){
  const all=results.flatMap(r=>r.perChannel.map(p=>p.status)); return cnt(all);
}

// 多路输出对比窗口(需求2):渲染单路一次请求的 content / reasoning / 工具调用
function outWindow(o){

  let s='';

  else if(o.content){ s+='<div class="cmp-note">content:</div><pre class="cmp-content">'+esc(o.content)+'</pre>'; }
  if(o.reasoning){ s+='<div class="cmp-note">reasoning(前300字):</div><pre class="rc-pre">'+esc(String(o.reasoning).slice(0,300))+'</pre>'; }
  if(!o.content&&!o.reasoning&&!(o.toolCalls&&o.toolCalls.length)) s+='<div class="cmp-note">HTTP '+o.http+' · 无文本输出</div>';
  if(o.finish) s+='<div class="cmp-note" style="color:var(--faint)">finish_reason: '+esc(o.finish)+'</div>';

}

  out.style.display='block'; out.textContent='发送中...'; st.textContent='请求中(经本地代理)';
  const body=JSON.stringify({model,messages:[{role:"user",content:"请精确回复 SPEC_TEXT_OK"}],max_tokens:64,temperature:1,stream:false});
  const t0=performance.now();
  const r=await proxyFetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body});
  const dt=(performance.now()-t0).toFixed(0);
  let parsed=""; try{parsed=JSON.stringify(JSON.parse(r.text),null,1).slice(0,800);}catch{parsed=r.text.slice(0,800);}
  if(r.ok){
    st.textContent='直连成功 '+dt+'ms';
    out.innerHTML='<span class="badge b-pass">HTTP '+r.status+' · '+dt+'ms</span>\n'+parsed;
  }else if(r.status===0){
    st.textContent='代理/网络不通';
    out.innerHTML='<span class="badge b-inc">未拿到响应 · '+dt+'ms</span>\n'+r.text+'\n请确认 serve.py 在跑、Endpoint 地址正确、网络可达。';
  }else{
    st.textContent='返回 '+r.status+' '+dt+'ms';
    out.innerHTML='<span class="badge b-fail">HTTP '+r.status+' · '+dt+'ms</span>\n'+parsed;
  }
};

// ====== 真发请求:经本地代理 /proxy 转发,绕浏览器跨域 ======
async function proxyFetch(url, opt){
  opt=opt||{};
  try{
    const r=await fetch("/proxy",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:url,method:opt.method||"POST",headers:opt.headers||{},body:opt.body||null})});
    const j=await r.json();
    return {ok:!!j.ok, status:j.status||0, text:j.body||"", headers:j.headers||{}};
  }catch(e){
    return {ok:false,status:0,text:"本地代理未响应:"+(e.message||e)+" (确认 serve.py 在跑)",headers:{}};
  }
}
function chatUrl(base){
  let b=(base||"").trim().replace(/\/$/,"");
  if(!b) return "";
  if(/\/chat\/completions$/.test(b)) return b;
  if(/\/v1$/.test(b)) return b+"/chat/completions";
  return b+"/v1/chat/completions";
}
async function callAPI(ch, body){
  const url=chatUrl(ch.base);
  const headers={"Content-Type":"application/json","Accept":"application/json"};
  if(ch.key) headers["Authorization"]="Bearer "+ch.key;
  if(ch.headers){ try{ Object.assign(headers, JSON.parse(ch.headers)); }catch(e){} }
  const r=await proxyFetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)});
  let json=null; try{ json=JSON.parse(r.text); }catch(e){}
  return {ok:r.ok,status:r.status,text:r.text,json:json};
}
function pickContent(j){ try{return j.choices[0].message.content||"";}catch(e){return "";} }
function pickFinishReason(j){ try{return j.choices[0].finish_reason||"";}catch(e){return "";} }
function pickToolCalls(j){ try{return j.choices[0].message.tool_calls||null;}catch(e){return null;} }
function pickReasoning(j){ try{return j.choices[0].message.reasoning_content||j.choices[0].message.reasoning||"";}catch(e){return "";} }
function sSlice(s){ return String(s==null?"":s).slice(0,140); }
function failRes(r,note){ return {status:"FAIL",tag:"real",note:note+" HTTP "+r.status+(r.text?(" · "+sSlice(r.text)):"")}; }
function isReasoningModel(m){ const b=bl(m); return !!(b.feat&&b.feat.thinking_mode===true); }
function jsonFromText(t){ if(!t) return null; let s=String(t).trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```\s*$/,""); if(s[0]==="{"||s[0]==="["){ try{return JSON.parse(s);}catch(e){} } const m=s.match(/(\{[\s\S]*\}|\[[\s\S]*\])/); if(m){ try{return JSON.parse(m[0]);}catch(e){} } return null; }
// 抓取一次请求的输出(content/reasoning/tool_calls/流),供多路输出对比窗口
function outOf(r){ if(!r) return null; const isStream=/data:\s/.test(String(r.text||"")); return { content: isStream?String(r.text).slice(0,800):(pickContent(r.json)||""), reasoning: pickReasoning(r.json)||"", toolCalls: pickToolCalls(r.json)||null, finish: pickFinishReason(r.json)||"", http: r.status, isStream, raw: String(r.text||"").slice(0,400) }; }

// 单模型单用例 -> {status, tag, note, out}。tag: real=真发 / baseline=基线 / skip=本轮跳过
async function realJudge(m, ch, c, params){
  const b=bl(m); const id=c.id; const modelId=ch.modelId||m.id;
  const notpubTemp = !b.temp || b.temp.min==="NOT_PUBLISHED";
  const mk=(res,r)=>({...res, out:r?outOf(r):null});
  const exactSentinel = t => String(t==null?'':t).trim().replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g,'')==="SPEC_TEXT_OK";
  if(id==="spec_text_io"){
    const mt=isReasoningModel(m)?2048:64;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"请精确回复哨兵 SPEC_TEXT_OK，不要输出其他内容。"}],max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const t=pickContent(r.json);
    if(exactSentinel(t)) return mk({status:"PASS",tag:"real",note:"精确返回哨兵 OK(去空白后 == SPEC_TEXT_OK)"},r);
    const loose=/SPEC_TEXT_OK/.test(t);
    if(loose) return mk({status:"FAIL",tag:"real",note:"含哨兵但非精确(有多余文字/前缀):"+sSlice(t)},r);
    const rc=pickReasoning(r.json);
    return mk((!t&&rc)?{status:"INCONCLUSIVE",tag:"real",note:"content 为空(思考预算可能耗尽),reasoning len="+rc.length+"，未能判定哨兵"}:{status:"FAIL",tag:"real",note:"未返回哨兵:"+sSlice(t)},r);
  }
  if(id==="spec_output_generation"){
    const mt=isReasoningModel(m)?2048:200;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"用中文写一段约50字的产品介绍。"}],max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const t=pickContent(r.json);
    if(t&&t.length>0) return mk({status:"PASS",tag:"real",note:"生成 len="+t.length+",finish="+pickFinishReason(r.json)},r);
    const rc=pickReasoning(r.json);
    return mk((!t&&rc)?{status:"INCONCLUSIVE",tag:"real",note:"content 为空,仅有 reasoning len="+rc.length}:{status:"FAIL",tag:"real",note:"空输出"},r);
  }
  if(id==="spec_invalid_request_errors"){
    const r=await callAPI(ch,{model:modelId,messages:[],max_tokens:16,stream:false});
    return mk((r.status>=400&&r.status<500)?{status:"PASS",tag:"real",note:"正确拒绝非法请求 HTTP "+r.status}:(r.ok?{status:"FAIL",tag:"real",note:"非法请求未被拒绝(200)"}:{status:"INCONCLUSIVE",tag:"real",note:"HTTP "+r.status+" "+sSlice(r.text)}),r);
  }
  if(id==="spec_parameter_boundaries"){
    if(notpubTemp) return {status:"INCONCLUSIVE",tag:"baseline",note:"官网未公布采样参数范围,无法判定",out:null};
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"hi"}],temperature:99999,max_tokens:16,stream:false});
    return mk((r.status>=400&&r.status<500)?{status:"PASS",tag:"real",note:"超界 temp 被拒绝 HTTP "+r.status}:(r.ok?{status:"FAIL",tag:"real",note:"超界 temp 未被拒绝"}:{status:"INCONCLUSIVE",tag:"real",note:"HTTP "+r.status}),r);
  }
  if(id==="spec_max_output_parameter"||id==="spec_max_completion_tokens_parameter"){
    // 需求3:已公布最大输出(如 DeepSeek-V4-Pro 384000)→真发请求证明该参数被接受;未公布(如 Kimi K2.5)→INC
    if(b.notpub) return {status:"INCONCLUSIVE",tag:"baseline",note:"官网未公布最大输出,按设计判 INC",out:null};
    const mo=b.maxOut||4096;
    const testMax=Math.min(mo, 4096); // 控成本:请求接受该量级即可证明参数生效,不真生成满额
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"输出一段连续文字。"}],max_tokens:testMax,stream:false});
    if(!r.ok) return mk(failRes(r,"max_tokens="+testMax+" 请求失败"),r);
    const t=pickContent(r.json); const fin=pickFinishReason(r.json);
    return mk({status:"PASS",tag:"real",note:"max_tokens="+testMax+" 被接受(声明上限 "+mo+"),finish="+fin+(t?(",生成 len="+t.length):",空输出")},r);
  }
  if(id==="spec_context_window"){
    // 轻量压测:构造接近窗口(封顶 64K)的长提示+结尾哨兵,真发验证窗口内接受
    const ctxTxt=b.ctx?(b.ctx>=1e6?(b.ctx/1e6)+"M":(b.ctx>=1e3?(b.ctx/1e3)+"K":b.ctx)):"?";
    const cap=b.ctx?Math.min(b.ctx, 65536):4096;
    const pad="x ".repeat(Math.floor(cap/2)); // ~cap 字符的填充
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:pad+"在文末请精确回复哨兵 CONTEXT_OK。"}],max_tokens:64,stream:false});
    if(!r.ok) return mk(failRes(r,"压测请求失败"),r);
    const t=pickContent(r.json);
    const toks=(r.json&&r.json.usage&&r.json.usage.prompt_tokens)||0;
    if(/CONTEXT_OK/.test(t)) return mk({status:"PASS",tag:"real",note:"窗口内接受(~"+cap+"字, prompt_tokens="+toks+")并返回哨兵"},r);
    if(r.ok) return mk({status:"INCONCLUSIVE",tag:"real",note:"接受 HTTP 200(prompt_tokens="+toks+")但无哨兵:"+(t?sSlice(t):"(空输出)")},r);
    return mk({status:"FAIL",tag:"real",note:"压测失败:"+sSlice(t)},r);
  }
  if(id==="cap_tool_result_roundtrip"){
    // 工具结果回传:第二轮模型应使用回填的天气结果作答
    const mt=isReasoningModel(m)?2048:128;
    const r=await callAPI(ch,{model:modelId,messages:[
      {role:"user",content:"北京天气怎么样？调用 get_weather 查。"},
      {role:"assistant",content:null,tool_calls:[{id:"call_1",type:"function",function:{name:"get_weather",arguments:'{"city":"北京"}'}}]},
      {role:"tool",tool_call_id:"call_1",content:"北京，晴，25℃。"}],
      max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const t=pickContent(r.json)||"";
    return mk(/25|晴|25℃|晴，25/.test(t)?{status:"PASS",tag:"real",note:"第二轮使用回填结果作答:"+sSlice(t)}:{status:"FAIL",tag:"real",note:"未使用回填结果:"+sSlice(t)},r);
  }
  if(id==="cap_tool_error_recovery"){
    // 工具鲁棒性:回传错误,模型应合理回应(非崩溃、非空)
    const mt=isReasoningModel(m)?2048:128;
    const r=await callAPI(ch,{model:modelId,messages:[
      {role:"user",content:"帮我查北京天气，调用 get_weather。"},
      {role:"assistant",content:null,tool_calls:[{id:"call_1",type:"function",function:{name:"get_weather",arguments:'{"city":"北京"}'}}]},
      {role:"tool",tool_call_id:"call_1",content:"ERROR: 工具服务不可用(503)。"}],
      max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const t=pickContent(r.json)||"";
    return mk((t.length>0&&/不可用|无法|失败|抱歉|暂|503|try|error/i.test(t))?{status:"PASS",tag:"real",note:"错误后合理回应:"+sSlice(t)}:(t.length>0?{status:"INCONCLUSIVE",tag:"real",note:"有回应但未明确处理错误:"+sSlice(t)}:{status:"FAIL",tag:"real",note:"错误后空输出"}),r);
  }
  if(id==="cap_tool_choice_modes"){
    // tool_choice=required:应强制触发工具调用
    const mt=isReasoningModel(m)?2048:128;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"你好。"}],
      tools:[{type:"function",function:{name:"get_weather",description:"获取天气",parameters:{type:"object",properties:{city:{type:"string"}}}}}],tool_choice:"required",max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const tc=pickToolCalls(r.json);
    return mk((tc&&tc.length)?{status:"PASS",tag:"real",note:"tool_choice=required 强制触发调用"}:{status:"FAIL",tag:"real",note:"required 模式未触发工具调用"},r);
  }
  if(id==="cap_streaming"){
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"从1数到5"}],max_tokens:64,stream:true});
    return mk(/data:\s/.test(r.text)?{status:"PASS",tag:"real",note:"收到 SSE 流"}:{status:"FAIL",tag:"real",note:"无 SSE 流:"+sSlice(r.text)},r);
  }
  if(id==="cap_function_calling"){
    const mt=isReasoningModel(m)?2048:128;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"北京今天天气怎么样？请调用工具查询。"}],
      tools:[{type:"function",function:{name:"get_weather",description:"获取城市天气",parameters:{type:"object",properties:{city:{type:"string"}},required:["city"]}}}],
      tool_choice:"auto",max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const tc=pickToolCalls(r.json); return mk((tc&&tc.length)?{status:"PASS",tag:"real",note:"触发调用 "+(tc[0].function&&tc[0].function.name||"tool")}:{status:"FAIL",tag:"real",note:"未触发工具调用"},r);
  }
  if(id==="cap_tool_no_false_positive"){
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"1+1等于几？直接回答数字,不要调用工具。"}],
      tools:[{type:"function",function:{name:"get_weather",description:"获取天气",parameters:{type:"object",properties:{city:{type:"string"}}}}}],tool_choice:"auto",max_tokens:64,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const tc=pickToolCalls(r.json); return mk((!tc||!tc.length)?{status:"PASS",tag:"real",note:"无误触工具"}:{status:"FAIL",tag:"real",note:"误触工具:"+(tc[0].function&&tc[0].function.name||"")},r);
  }
  if(id==="cap_structured_output"){
    const mt=isReasoningModel(m)?2048:128;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"只返回一个JSON对象，不要任何解释：{\"ok\":true,\"n\":42}"}],response_format:{type:"json_object"},max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const t=pickContent(r.json); const o=jsonFromText(t);
    if(o) return mk({status:"PASS",tag:"real",note:"合法 JSON"},r);
    const rc=pickReasoning(r.json);
    return mk((!t&&rc)?{status:"INCONCLUSIVE",tag:"real",note:"content 为空,reasoning len="+rc.length}:{status:"FAIL",tag:"real",note:"非 JSON:"+sSlice(t)},r);
  }
  if(id==="cap_json_schema_output"){
    const mt=isReasoningModel(m)?2048:128;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"按schema返回用户: name=张三, age=18"}],
      response_format:{type:"json_schema",json_schema:{name:"user",strict:false,schema:{type:"object",properties:{name:{type:"string"},age:{type:"integer"}},required:["name","age"]}}},max_tokens:mt,stream:false});
    if(!r.ok) return mk({status:"INCONCLUSIVE",tag:"real",note:"可能不支持 json_schema HTTP "+r.status+" "+sSlice(r.text)},r);
    const t=pickContent(r.json); const o=jsonFromText(t); let ok=false; if(o) ok=!!(o.name&&o.age!=null);
    if(ok) return mk({status:"PASS",tag:"real",note:"符合 schema"},r);
    const rc=pickReasoning(r.json);
    return mk((!t&&rc)?{status:"INCONCLUSIVE",tag:"real",note:"content 为空,reasoning len="+rc.length}:{status:"FAIL",tag:"real",note:"不符 schema:"+sSlice(t)},r);
  }
  if(id==="cap_multi_round_chat"){
    const mt=isReasoningModel(m)?2048:64;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"我叫小明，请记住。"},{role:"assistant",content:"你好小明，我记住了。"},{role:"user",content:"我叫什么名字？只回答名字。"}],max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const t=pickContent(r.json)||"";
    if(/小明/.test(t)) return mk({status:"PASS",tag:"real",note:"多轮记忆 OK"},r);
    const rc=pickReasoning(r.json);
    return mk((!t&&rc)?{status:"INCONCLUSIVE",tag:"real",note:"content 为空,reasoning len="+rc.length}:{status:"FAIL",tag:"real",note:"多轮记忆失败:"+sSlice(t)},r);
  }
  if(id==="cap_tool_parallel_calls"){
    const mt=isReasoningModel(m)?2048:256;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"同时查北京和上海两个城市的天气。"}],
      tools:[{type:"function",function:{name:"get_weather",description:"获取天气",parameters:{type:"object",properties:{city:{type:"string"}},required:["city"]}}}],tool_choice:"auto",max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const tc=pickToolCalls(r.json)||[]; return mk(tc.length>=2?{status:"PASS",tag:"real",note:"并行调用 "+tc.length+" 个"}:{status:"INCONCLUSIVE",tag:"real",note:"仅调用 "+tc.length+" 个(未并行或指令不够明确)"},r);
  }
  if(id==="cap_thinking_enabled"){
    const mt=isReasoningModel(m)?4096:768;
    const r=await callAPI(ch,{model:modelId,messages:[{role:"user",content:"请一步步思考：123 乘以 456 等于多少？给出推理过程。"}],max_tokens:mt,stream:false});
    if(!r.ok) return mk(failRes(r,"请求失败"),r);
    const rc=pickReasoning(r.json); return mk(rc?{status:"PASS",tag:"real",note:"返回思考内容 len="+rc.length}:{status:"INCONCLUSIVE",tag:"real",note:"未暴露 reasoning_content(端点可能不回传该字段)"},r);
  }
  if(id==="cap_multimodal_image_input"){
    return {status:"SKIP",tag:"skip",note:(b.feat&&b.feat.vision===true)?"官方支持视觉,本轮未实测":"文本模型不适用",out:null};
  }
  return {status:"SKIP",tag:"skip",note:"本轮未实测,可扩展",out:null};
}
async function runPool(tasks, conc, onDone){
  let i=0, done=0; const n=tasks.length;
  async function worker(){ while(true){ const idx=i++; if(idx>=n) break; await tasks[idx](); done++; if(onDone)onDone(done,n); } }
  await Promise.all(Array.from({length:Math.max(1,Math.min(conc,n))}, worker));
}
async function realRun(){
  const profile=$("#profileSelect").value;
  const params={temp:+$("#gTemp").value,topp:+$("#gTopP").value,max:+$("#gMax").value,prompt:$("#gPrompt").value};
  const chans=channels.map(c=>{const m=MODELS[c.modelIdx];return {model:m,modelId:c.modelId||m.id,base:c.base,key:c.key,headers:c.headers,proto:c.proto};});
  // 初始化 run：每路每用例先占 pending 槽位
  const run={run_id:"real_"+Date.now(),multi:true,profile,params,started_at:new Date().toISOString(),running:true,channels:chans,results:PLAN_ARR.map(c=>({case:c,perChannel:chans.map(ch=>({ch,status:"PENDING",tag:"pending",note:"",out:null,elapsed:0}))}))};
  SIM_RUNS.unshift(run);
  const total=chans.length*PLAN_ARR.length;
  // 切到进行中 tab，实时渲染
  switchTab('running');
  let doneCnt=0;
  const tick=()=>{ renderRunning(); };
  $("#launchBtn").textContent="真发中 0/"+total;
  $("#launchBtn").disabled=true;
  tick();
  const perCh=new Array(chans.length);
  for(let ci=0;ci<chans.length;ci++){
    const ch=chans[ci]; const baseDone=ci*PLAN_ARR.length;
    const tasks=PLAN_ARR.map((c,idx)=>async()=>{
      const t0=performance.now();
      // 标 RUNNING
      run.results[idx].perChannel[ci]={ch,status:"RUNNING",tag:"running",note:"",out:null,elapsed:0};
      tick();
      try{
        const r=await realJudge(ch.model,ch,c,params);
        const elapsed=Math.round(performance.now()-t0);
        run.results[idx].perChannel[ci]={ch,status:r.status,tag:r.tag,note:r.note||"",out:r.out||null,elapsed};
      }catch(e){
        const elapsed=Math.round(performance.now()-t0);
        run.results[idx].perChannel[ci]={ch,status:"FAIL",tag:"real",note:"异常:"+(e.message||e),out:null,elapsed};
      }
      doneCnt++;
      $("#launchBtn").textContent="真发中 "+doneCnt+"/"+total;
      tick();
    });
    await runPool(tasks,3);
  }
  run.running=false;
  run.ended_at=new Date().toISOString();
  $("#launchBtn").textContent="启动多路验收";
  $("#launchBtn").disabled=false;
  saveRuns();
  // 跑完切到已完成
  switchTab('done'); renderDone(); renderCompare();
}

function switchTab(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('show',s.id==='v-'+v));

  if(v==='chat')renderChat();
}

// ====== 演示种子数据(基于真实SAMPLE_RUNS) ======
const SIM_RUNS=[];
// 持久化验收结果(需求4:刷新不丢 + 供向量库检索)
const STORE_KEY='starflow_runs_v1';
function saveRuns(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(SIM_RUNS.slice(0,20))); }catch(e){} }
function loadRuns(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'null'); }catch(e){ return null; } }
(function seed(){
  const persisted=loadRuns();
  if(persisted&&persisted.length){ persisted.forEach(r=>SIM_RUNS.push(r)); }
  else { SAMPLE_RUNS.forEach(r=>{ /* 用真实counts造一张单模型展示卡 */ }); }

// ====== 需求4: 本地向量库(TF-IDF+余弦) + LLM 对话分析 ======
const CHAT_KEY='starflow_chat_v1';
let CHAT=[];
function loadChat(){ try{ CHAT=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]'); }catch(e){ CHAT=[]; } }
function saveChat(){ try{ localStorage.setItem(CHAT_KEY, JSON.stringify(CHAT.slice(-30))); }catch(e){} }
loadChat();

// 中文友好分词: CJK 单字 + 英文/数字词
function tokenize(s){ const t=String(s==null?'':s).toLowerCase(); const out=[]; for(const ch of t){ if(/[一-鿿]/.test(ch)) out.push(ch); } const m=t.match(/[a-z0-9_]+/g)||[]; return out.concat(m); }
function buildIndex(docs){ // docs: [{id,text}]
  const N=docs.length||1; const df={};
  docs.forEach(d=>{ const seen=new Set(tokenize(d.text)); seen.forEach(w=>df[w]=(df[w]||0)+1); });
  const idf={}; Object.keys(df).forEach(w=>idf[w]=Math.log((N+1)/(df[w]+1))+1);
  const vecs=docs.map(d=>{ const tf={}; tokenize(d.text).forEach(w=>tf[w]=(tf[w]||0)+1); const v={}; Object.keys(tf).forEach(w=>v[w]=tf[w]*idf[w]); return v; });
  return {idf, vecs};
}
function qvec(q, idf){ const tf={}; tokenize(q).forEach(w=>tf[w]=(tf[w]||0)+1); const v={}; Object.keys(tf).forEach(w=>{ if(idf[w]!=null) v[w]=tf[w]*idf[w]; }); return v; }
function cosine(a,b){ let dot=0,na=0,nb=0; const keys=new Set([...Object.keys(a),...Object.keys(b)]); keys.forEach(k=>{const x=a[k]||0,y=b[k]||0;dot+=x*y;na+=x*x;nb+=y*y;}); return (na&&nb)?dot/(Math.sqrt(na)*Math.sqrt(nb)):0; }
function gatherDocs(){ // 从所有验收run构造文档
  const docs=[];
  SIM_RUNS.forEach(run=>{ run.results.forEach(r=>{ r.perChannel.forEach((p,ci)=>{ const ch=run.channels[ci]; const txt=`${r.case.name} ${r.case.id} ${r.case.desc||''} ${ch.model.name} ${p.status} ${p.note||''} ${(p.out&&p.out.content)||''} ${(p.out&&p.out.reasoning)||''}`; docs.push({id:run.run_id+'/'+ci+'/'+r.case.id, run, ci, case:r.case, p, ch, text:txt}); }); }); });
  return docs;
}
function retrieve(query, k){ const docs=gatherDocs(); if(!docs.length) return []; const idx=buildIndex(docs); const qv=qvec(query, idx.idf); const scored=docs.map((d,i)=>({d, s:cosine(qv, idx.vecs[i])})).sort((a,b)=>b.s-a.s); return scored.slice(0,k).filter(x=>x.s>0).map(x=>x.d); }
function runSummary(run){ // 最近一次验收摘要
  const tally={PASS:0,FAIL:0,INCONCLUSIVE:0,SKIP:0}; run.results.forEach(r=>r.perChannel.forEach(p=>{tally[p.status]=(tally[p.status]||0)+1;}));
  let lines=`汇总: PASS ${tally.PASS||0} / FAIL ${tally.FAIL||0} / INC ${tally.INCONCLUSIVE||0} / SKIP ${tally.SKIP||0}\n`;
  lines+='逐项:\n'; run.results.forEach(r=>{ const per=r.perChannel.map((p,ci)=>`${run.channels[ci].model.name}=${p.status}`).join(' '); lines+=`- ${r.case.name}(${r.case.id}): ${per}\n`; });
  return lines;
}
function ctxText(docs, run){ let s=''; if(run) s+='【最近一次验收】\n'+runSummary(run)+'\n'; if(docs.length){ s+='【历史相关片段(向量检索top-'+docs.length+')】\n'; docs.forEach((d,i)=>{ s+=`[${i+1}] run=${d.run.run_id} 模型=${d.ch.model.name} 用例=${d.case.name}(${d.case.id}) 状态=${d.p.status} 备注=${d.p.note||''}\n`; if(d.p.out&&d.p.out.content) s+='  输出摘要:"'+String(d.p.out.content).slice(0,120).replace(/\n/g,' ')+'"\n'; }); } return s||'（暂无验收数据）'; }

async function callAnalyst(question, context){
  const ci=+$("#analystCh").value; const ch=channels[ci]; if(!ch||!ch.base||!ch.key) return '未选择有效分析员通道(需 Base URL + Key)。请在「发起测试」配置后回到此处。';
  const sys='你是 LLM 多路验收对比分析助手。根据给定的验收数据(最近一次+历史相关片段)回答用户问题。要求:简明、分点、指出不一致项与可能原因、给出可操作建议。若数据不足以判断,如实说明。';
  const msgs=[{role:'system',content:sys+'\n\n'+context},{role:'user',content:question}];
  const r=await callAPI(ch,{model:ch.modelId,messages:msgs,max_tokens:1024,stream:false});
  if(!r.ok) return '分析调用失败 HTTP '+r.status+' '+(r.text||'').slice(0,200);
  const t=pickContent(r.json);
  return t||('（分析员未返回文本。原始响应:'+String(r.text).slice(0,200)+'）');
}

function renderChat(){ const log=$("#chatLog"); if(!log) return;
  const sel=$("#analystCh"); if(sel){ sel.innerHTML=channels.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.model||'?')} · ${esc((c.base||'').slice(0,30))||'未配置'}</option>`).join(''); if(channels.length) sel.value=Math.min(sel.value||0, channels.length-1); }
  log.innerHTML=CHAT.map(m=>`<div class="chat-msg ${m.role}"><div class="bubble">${esc(m.text)}</div>${m.ctx?`<div class="chat-ctx">${esc(m.ctx)}</div>`:''}</div>`).join('') || '<div class="cmp-note">还没有对话。提问验收结果即可（如：哪几项不一致？为什么 Kimi 判 INC 而 DeepSeek 判 PASS？）。</div>';
  log.scrollTop=log.scrollHeight;
}
async function chatAsk(){
  const inp=$("#chatInput"); const q=inp.value.trim(); if(!q) return;
  inp.value=''; CHAT.push({role:'user',text:q}); renderChat();
  const run=SIM_RUNS[0]; const docs=retrieve(q, +($("#chatTopK").value)||8); const ctx=ctxText(docs, run);
  const ans=await callAnalyst(q, ctx);
  const ctxLabel='检索到 '+docs.length+' 条历史片段'+(run?(' · 含最近一次「'+run.run_id+'」'):'');
  CHAT.push({role:'bot',text:ans,ctx:ctxLabel}); saveChat(); renderChat();
}
$("#chatSend").onclick=chatAsk;
$("#chatInput").addEventListener('keydown',e=>{ if(e.key==='Enter')chatAsk(); });
$("#chatClear").onclick=()=>{ CHAT=[]; saveChat(); renderChat(); };
</script>

<script>
// ====== Coze 风格适配层 ======

// 1. Tab 切换改用 .tab
function switchTab(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('show',s.id==='v-'+v));

  if(v==='chat')renderChat();
}
document.querySelectorAll('.tab').forEach(t=>{ if(t.dataset.v) t.onclick=()=>switchTab(t.dataset.v); });

// 2. 分段选择器工具
function buildSeg(containerId, options, defaultVal, onChange){
  const c=document.getElementById(containerId); if(!c) return defaultVal;
  c.innerHTML='';
  options.forEach(opt=>{
    const val=(typeof opt==='object')?opt.value:opt;
    const label=(typeof opt==='object')?opt.label:opt;
    const b=document.createElement('button');
    b.textContent=label; b.dataset.val=val;
    if(val===defaultVal) b.classList.add('on');
    b.onclick=()=>{ c.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); if(onChange) onChange(val); };
    c.appendChild(b);
  });
}

// 3. protoSelect → protoSeg
const _origSyncProto=syncProto;
syncProto=function(){
  _origSyncProto();
  const sel=$("#protoSelect"); const seg=$("#protoSeg"); if(!seg) return;
  seg.innerHTML='';
  for(let i=0;i<sel.options.length;i++){
    const v=sel.options[i].value;
    const label={openai:'Chat API',responses:'Responses API',anthropic:'Anthropic'}[v]||v;
    const b=document.createElement('button'); b.textContent=label; b.dataset.val=v;
    if(v===sel.value) b.classList.add('on');
    b.onclick=()=>{ sel.value=v; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); };
    seg.appendChild(b);
  }
};

// 4. profileSeg
buildSeg('profileSeg',[{value:'smoke',label:'smoke'},{value:'standard',label:'standard'},{value:'full',label:'full'}],'standard',function(v){
  $("#profileSelect").value=v;
});

// 5. 多样性模式
let DIV_MODE='balanced';
const DIV_PRESETS={precise:{temp:0,topp:0.1},balanced:{temp:1,topp:0.95},creative:{temp:1.3,topp:0.98}};
buildSeg('divSeg',[{value:'precise',label:'精确模式'},{value:'balanced',label:'平衡模式'},{value:'creative',label:'创意模式'},{value:'custom',label:'自定义'}],'balanced',function(v){
  DIV_MODE=v;
  const cp=document.getElementById('customParams');

  cp.style.display='none';

// 6. 深度思考开关 + 程度
let THINK_ON='enabled', THINK_EFFORT='max';
buildSeg('thinkSeg',[{value:'enabled',label:'开启'},{value:'disabled',label:'关闭'}],'enabled',function(v){ THINK_ON=v; });

// ====== 重写 renderBaseline 为分组表格 ======
function fmtCtx(n){ if(!n) return '<span class="np">未公布</span>'; return n>=1e6?(n/1e6)+'M':(n>=1e3?(n/1e3)+'K':n); }
function fmtTPM(t){ return t>=1e6?(t/1e6)+'M':(t>=1e3?(t/1e3)+'K':t); }
function featVal(v){
  if(v===true) return '<span class="yes">支持</span>';
  if(v===false) return '<span class="no">不支持</span>';
  return '<span class="np">未公布</span>';
}
function renderBaseline(i){
  const m=MODELS[i]; const b=bl(m);
  let h='';
  h+='<div class="bl-title">'+esc(m.name)+'<span class="vendor">'+esc(m.vendor)+'</span></div>';

  // 组1: 基本信息
  h+='<div class="bl-grp"><div class="bl-grp-h">基本信息</div>';
  h+='<table class="bl-tbl">';
  h+='<tr><td class="k">上下文</td><td class="v">'+(b.ctx?fmtCtx(b.ctx):'<span class="np">未公布</span>')+'</td></tr>';
  h+='<tr><td class="k">最大输出</td><td class="v">'+(b.notpub?'<span class="np">未公布</span>':(b.maxOut?fmtCtx(b.maxOut):'<span class="np">未公布</span>'))+'</td></tr>';
  const protos=(m.protocols&&m.protocols.length)?m.protocols.join(' / '):'openai';
  h+='<tr><td class="k">协议</td><td class="v">'+esc(protos)+'</td></tr>';
  if(b.bestFor) h+='<tr><td class="k">适用场景</td><td class="v"><span class="bl-bestfor">'+esc(b.bestFor)+'</span></td></tr>';
  h+='</table></div>';

  // 组2: 能力开关
  const feat=b.feat||{};
  h+='<div class="bl-grp"><div class="bl-grp-h">能力</div><div class="bl-feat">';
  [['streaming','流式'],['function_calling','工具调用'],['vision','视觉'],['thinking_mode','思考'],['system_prompt','系统提示']].forEach(pair=>{
    h+='<div class="fi"><span class="fk">'+pair[1]+'</span><span class="fv">'+featVal(feat[pair[0]])+'</span></div>';
  });
  h+='</div></div>';

  // 组3: 采样参数
  h+='<div class="bl-grp"><div class="bl-grp-h">采样参数</div>';
  h+='<table class="bl-tbl">';
  h+='<tr><td class="k">Temp</td><td class="v">'+(b.temp?('['+ (b.temp.min??b.temp[0]) +'~'+ (b.temp.max??b.temp[1]) +'] 默认'+(b.temp.default??'—')):'<span class="np">未公布</span>')+'</td></tr>';
  h+='<tr><td class="k">Top_p</td><td class="v">'+(b.topp?('['+ (b.topp.min??b.topp[0]) +'~'+ (b.topp[1]??b.topp.max) +']'):'<span class="np">未公布</span>')+'</td></tr>';
  h+='</table></div>';

  // 组4: 限速与价格
  h+='<div class="bl-grp"><div class="bl-grp-h">限速与价格</div>';
  h+='<table class="bl-tbl">';
  let rl=''; if(b.rl){
    if(b.rl.concurrency!=null) rl+='并发 '+b.rl.concurrency;
    if(b.rl.rpm!=null) rl+=(rl?' · ':'')+'RPM '+b.rl.rpm;
    if(b.rl.tpm!=null) rl+=(rl?' · ':'')+'TPM '+fmtTPM(b.rl.tpm);
    if(b.rl.note) rl+='<div style="font-size:10.5px;color:var(--faint);margin-top:2px">'+esc(b.rl.note)+'</div>';
  }
  h+='<tr><td class="k">限速</td><td class="v">'+(rl||'<span class="np">未公布</span>')+'</td></tr>';
  // 价格:优先用 baseline 子对象的明细(含缓存命中/未命中)
  const bp=b.bpr||{};
  if(bp.input_cache_hit_per_million!=null||bp.input_cache_miss_per_million!=null||bp.output_per_million!=null){
    let pr='';
    const hit=bp.input_cache_hit_per_million, miss=bp.input_cache_miss_per_million, out=bp.output_per_million;
    if(miss!=null) pr+='输入 '+miss;
    if(out!=null) pr+=(pr?' / ':'')+'输出 '+out;
    pr+=' 元/M';
    if(hit!=null) pr+='<div style="font-size:10.5px;color:var(--faint);margin-top:2px">缓存命中 '+hit+' 元/M · 未命中 '+(miss!=null?miss:'—')+'</div>';
    h+='<tr><td class="k">价格(入/出)</td><td class="v">'+pr+'</td></tr>';
  }else if(b.pricing&&b.pricing.input!=null){
    h+='<tr><td class="k">价格(入/出)</td><td class="v">'+(b.pricing.input??'—')+' / '+(b.pricing.output??'—')+' 元/M</td></tr>';
  }else{
    h+='<tr><td class="k">价格(入/出)</td><td class="v"><span class="np">未公布</span></td></tr>';
  }
  // benchmark
  if(b.benchmark){
    let bm='';
    if(b.benchmark.status) bm+=b.benchmark.status;
    if(b.benchmark.note) bm+=(bm?' · ':'')+esc(b.benchmark.note);
    if(b.benchmark.scores){ try{ bm+=Object.entries(b.benchmark.scores).map(([k,v])=>k+': '+v).join(' · '); }catch(e){} }
    if(bm) h+='<tr><td class="k">Benchmark</td><td class="v" style="font-size:11px">'+bm+'</td></tr>';
  }
  h+='</table></div>';

  // 组5: 官网来源
  if(b.sources&&b.sources.length){
    h+='<div class="bl-grp"><div class="bl-grp-h">官网来源</div><div class="bl-srcs">';
    b.sources.forEach(u=>{ h+='<a href="'+esc(u)+'" target="_blank">'+esc(u)+'</a>'; });
    h+='</div></div>';
  }

  $("#baselineBox").innerHTML=h;
}
