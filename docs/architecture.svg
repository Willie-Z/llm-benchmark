<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <style>
      .title{font-size:22px;font-weight:700;fill:#1a1a1a}
      .subtitle{font-size:13px;fill:#666}
      .layer{font-size:15px;font-weight:700;fill:#fff}
      .node{font-size:12px;fill:#1a1a1a}
      .nodeSmall{font-size:11px;fill:#444}
      .edge{font-size:10px;fill:#888}
      .box{stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#bbb" opacity="0.6"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="640" y="32" text-anchor="middle" class="title">星流 LLM 多路 Endpoint 验收对比工具 · 逻辑架构</text>
  <text x="640" y="52" text-anchor="middle" class="subtitle">纯前端 + 直连现有后端，不新建后端 ｜ 2026-08-31</text>

  <!-- ============ 用户层 ============ -->
  <rect x="490" y="70" width="300" height="50" rx="8" fill="#e8f4f8" stroke="#2196f3" class="box"/>
  <text x="640" y="95" text-anchor="middle" class="layer" fill="#0d47a1">用户层 · 浏览器</text>
  <text x="640" y="112" text-anchor="middle" class="nodeSmall">用户操作 · API Key 仅存本地不外传</text>

  <!-- 箭头 用户→前端 -->
  <line x1="640" y1="120" x2="640" y2="145" stroke="#888" marker-end="url(#arrow)"/>

  <!-- ============ 前端应用层 ============ -->
  <rect x="40" y="145" width="1200" height="200" rx="10" fill="#fff8e1" stroke="#ff9800" class="box"/>
  <text x="60" y="168" class="layer" fill="#e65100">前端应用层 · React/Vue 纯前端</text>

  <!-- 5个前端节点 -->
  <rect x="60" y="185" width="200" height="70" rx="6" fill="#fff3cd" stroke="#ffc107"/>
  <text x="160" y="208" text-anchor="middle" class="node" font-weight="700">① 工作台</text>
  <text x="160" y="226" text-anchor="middle" class="nodeSmall">选模型/配通道</text>
  <text x="160" y="242" text-anchor="middle" class="nodeSmall">全局超参</text>

  <rect x="290" y="185" width="200" height="70" rx="6" fill="#fff3cd" stroke="#ffc107"/>
  <text x="390" y="208" text-anchor="middle" class="node" font-weight="700">② 用例生成 Agent</text>
  <text x="390" y="226" text-anchor="middle" class="nodeSmall">LLM 驱动 (v2.0)</text>
  <text x="390" y="242" text-anchor="middle" class="nodeSmall">客户标准→用例</text>

  <rect x="520" y="185" width="220" height="70" rx="6" fill="#fff3cd" stroke="#ffc107"/>
  <text x="630" y="208" text-anchor="middle" class="node" font-weight="700">③ 多路调度器</text>
  <text x="630" y="226" text-anchor="middle" class="nodeSmall">Promise.all + 限速节流</text>
  <text x="630" y="242" text-anchor="middle" class="nodeSmall">每5s轮询</text>

  <rect x="770" y="185" width="200" height="70" rx="6" fill="#fff3cd" stroke="#ffc107"/>
  <text x="870" y="208" text-anchor="middle" class="node" font-weight="700">④ 四态判定器</text>
  <text x="870" y="226" text-anchor="middle" class="nodeSmall">PASS/FAIL/INC/SKIP</text>
  <text x="870" y="242" text-anchor="middle" class="nodeSmall">基线驱动</text>

  <rect x="1000" y="185" width="220" height="70" rx="6" fill="#fff3cd" stroke="#ffc107"/>
  <text x="1110" y="208" text-anchor="middle" class="node" font-weight="700">⑤ 渲染器</text>
  <text x="1110" y="226" text-anchor="middle" class="nodeSmall">验证卡 + 多路对比表</text>
  <text x="1110" y="242" text-anchor="middle" class="nodeSmall">✅❌⚠️⏭️ 徽章</text>

  <!-- 前端内部流程箭头 -->
  <line x1="260" y1="220" x2="290" y2="220" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="490" y1="220" x2="520" y2="220" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="740" y1="220" x2="770" y2="220" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="970" y1="220" x2="1000" y2="220" stroke="#888" marker-end="url(#arrow)"/>

  <!-- 工作流说明 -->
  <text x="640" y="290" text-anchor="middle" class="edge">选模型 → 加载基线 → 配通道 → 选用例 → 启动 → 并发调度 → 轮询 → 四态判定 → 渲染</text>
  <text x="640" y="312" text-anchor="middle" class="nodeSmall" fill="#e65100">限速口径三家不同：DeepSeek/智谱=并发数 ｜ Kimi/MiniMax/MiMo=RPM/TPM → 节流按各家口径，不横比</text>

  <!-- 前端→数据层 虚线 -->
  <line x1="160" y1="345" x2="160" y2="380" stroke="#bbb" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <line x1="390" y1="345" x2="390" y2="380" stroke="#bbb" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <line x1="630" y1="345" x2="520" y2="380" stroke="#bbb" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>

  <!-- ============ 数据层 ============ -->
  <rect x="40" y="380" width="560" height="110" rx="10" fill="#e8f5e9" stroke="#4caf50" class="box"/>
  <text x="60" y="403" class="layer" fill="#1b5e20">数据层 · 前端打包/外挂</text>

  <rect x="60" y="415" width="120" height="60" rx="5" fill="#c8e6c9" stroke="#4caf50"/>
  <text x="120" y="435" text-anchor="middle" class="node" font-weight="700">catalog.json</text>
  <text x="120" y="452" text-anchor="middle" class="nodeSmall">聚合模型树</text>
  <text x="120" y="467" text-anchor="middle" class="nodeSmall">39模型</text>

  <rect x="195" y="415" width="120" height="60" rx="5" fill="#c8e6c9" stroke="#4caf50"/>
  <text x="255" y="435" text-anchor="middle" class="node" font-weight="700">baselines/v2</text>
  <text x="255" y="452" text-anchor="middle" class="nodeSmall">5家·官网来源</text>
  <text x="255" y="467" text-anchor="middle" class="nodeSmall">NOT_PUBLISHED</text>

  <rect x="330" y="415" width="120" height="60" rx="5" fill="#c8e6c9" stroke="#4caf50"/>
  <text x="390" y="435" text-anchor="middle" class="node" font-weight="700">bench_plan</text>
  <text x="390" y="452" text-anchor="middle" class="nodeSmall">27用例</text>
  <text x="390" y="467" text-anchor="middle" class="nodeSmall">expected/refs</text>

  <rect x="465" y="415" width="120" height="60" rx="5" fill="#c8e6c9" stroke="#4caf50"/>
  <text x="525" y="435" text-anchor="middle" class="node" font-weight="700">bench_runs</text>
  <text x="525" y="452" text-anchor="middle" class="nodeSmall">3 run样本</text>
  <text x="525" y="467" text-anchor="middle" class="nodeSmall">mock验证</text>

  <!-- ============ 后端层 ============ -->
  <rect x="630" y="380" width="610" height="110" rx="10" fill="#fce4ec" stroke="#e91e63" class="box"/>
  <text x="650" y="403" class="layer" fill="#880e4f">后端层 · 公司现有（不新建）</text>

  <rect x="650" y="415" width="170" height="60" rx="5" fill="#f8bbd0" stroke="#e91e63"/>
  <text x="735" y="438" text-anchor="middle" class="node" font-weight="700">kspmas.ksyun.com</text>
  <text x="735" y="455" text-anchor="middle" class="nodeSmall">120.92.93.22</text>
  <text x="735" y="470" text-anchor="middle" class="nodeSmall">同服务</text>

  <rect x="840" y="415" width="180" height="60" rx="5" fill="#f8bbd0" stroke="#e91e63"/>
  <text x="930" y="438" text-anchor="middle" class="node" font-weight="700">GET /api/plan</text>
  <text x="930" y="455" text-anchor="middle" class="nodeSmall">27用例下发</text>
  <text x="930" y="470" text-anchor="middle" class="nodeSmall">HTTP200 免登录</text>

  <rect x="1040" y="415" width="180" height="60" rx="5" fill="#f8bbd0" stroke="#e91e63"/>
  <text x="1130" y="438" text-anchor="middle" class="node" font-weight="700">GET·POST /api/runs</text>
  <text x="1130" y="455" text-anchor="middle" class="nodeSmall">run结果/启动</text>
  <text x="1130" y="470" text-anchor="middle" class="nodeSmall">counts四态</text>

  <!-- 前端→后端 虚线 -->
  <line x1="630" y1="345" x2="930" y2="380" stroke="#bbb" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>

  <!-- 数据层/后端 → 执行层 -->
  <line x1="930" y1="490" x2="930" y2="520" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="630" y1="345" x2="640" y2="520" stroke="#888" marker-end="url(#arrow)"/>

  <!-- ============ 执行层 ============ -->
  <rect x="40" y="520" width="1200" height="100" rx="10" fill="#f3e5f5" stroke="#9c27b0" class="box"/>
  <text x="60" y="543" class="layer" fill="#4a148c">执行层 · 三态切换</text>

  <rect x="80" y="555" width="300" height="50" rx="6" fill="#e1bee7" stroke="#9c27b0"/>
  <text x="230" y="578" text-anchor="middle" class="node" font-weight="700">线上：直连 /api/runs</text>
  <text x="230" y="595" text-anchor="middle" class="nodeSmall">后端编排跑测</text>

  <rect x="490" y="555" width="300" height="50" rx="6" fill="#e1bee7" stroke="#9c27b0"/>
  <text x="640" y="578" text-anchor="middle" class="node" font-weight="700">本地：serve.py 代理</text>
  <text x="640" y="595" text-anchor="middle" class="nodeSmall">→各厂商端点（绕CORS）真发</text>

  <rect x="900" y="555" width="300" height="50" rx="6" fill="#e1bee7" stroke="#9c27b0"/>
  <text x="1050" y="578" text-anchor="middle" class="node" font-weight="700">线上无代理：模拟演示</text>
  <text x="1050" y="595" text-anchor="middle" class="nodeSmall">自动退回，不报错</text>

  <!-- 执行层→被测方 -->
  <line x1="640" y1="620" x2="640" y2="655" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="230" y1="620" x2="230" y2="655" stroke="#888" marker-end="url(#arrow)"/>

  <!-- ============ 被测方 ============ -->
  <rect x="40" y="655" width="1200" height="180" rx="10" fill="#eeeeee" stroke="#616161" class="box"/>
  <text x="60" y="678" class="layer" fill="#212121">被测方 · 多路 Endpoint（同一模型 N 路并排）</text>

  <!-- 三路通道 -->
  <rect x="80" y="695" width="220" height="55" rx="6" fill="#bdbdbd" stroke="#616161"/>
  <text x="190" y="718" text-anchor="middle" class="node" font-weight="700">路1 官网直连</text>
  <text x="190" y="735" text-anchor="middle" class="nodeSmall">api.deepseek.com 等</text>

  <rect x="330" y="695" width="220" height="55" rx="6" fill="#bdbdbd" stroke="#616161"/>
  <text x="440" y="718" text-anchor="middle" class="node" font-weight="700">路2 星流中转</text>
  <text x="440" y="735" text-anchor="middle" class="nodeSmall">星流聚合 API</text>

  <rect x="580" y="695" width="220" height="55" rx="6" fill="#bdbdbd" stroke="#616161"/>
  <text x="690" y="718" text-anchor="middle" class="node" font-weight="700">路3 自建网关</text>
  <text x="690" y="735" text-anchor="middle" class="nodeSmall">公司网关</text>

  <!-- 5家厂商 -->
  <rect x="80" y="775" width="1160" height="45" rx="6" fill="#9e9e9e" stroke="#424242"/>
  <text x="660" y="803" text-anchor="middle" class="node" font-weight="700" fill="#fff">5家厂商：Kimi · DeepSeek · 智谱 · MiniMax · MiMo（v2基线 39模型）</text>

  <!-- 三路→厂商 -->
  <line x1="190" y1="750" x2="300" y2="775" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="440" y1="750" x2="550" y2="775" stroke="#888" marker-end="url(#arrow)"/>
  <line x1="690" y1="750" x2="800" y2="775" stroke="#888" marker-end="url(#arrow)"/>

  <!-- ============ 底部说明 ============ -->
  <rect x="40" y="855" width="1200" height="105" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="60" y="878" class="node" font-weight="700" fill="#333">关键约束</text>
  <text x="60" y="898" class="nodeSmall">① 不笼统跑分：每项参数独立验证，非跑几个Benchmark出总分</text>
  <text x="60" y="916" class="nodeSmall">② 各模型按各自官方信息建基座：基线各自独立，不强套统一模板，不浪费token</text>
  <text x="60" y="934" class="nodeSmall">③ 产出可读卡片：✅❌⚠️⏭️ 四态标注，不堆砌原始数据</text>
  <text x="60" y="952" class="nodeSmall">④ 官网未公布→INC（不编造）｜ 不适用→SKIP（不误判FAIL）｜ Key不出浏览器</text>
</svg>
